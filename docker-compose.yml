name: workout-log

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workout
      POSTGRES_PASSWORD: workout
      POSTGRES_DB: workout
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workout -d workout']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://workout:workout@db:5432/workout?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Creates demo@example.com / demo-password with a year of workouts.
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-4413}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/api/health']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  db-data:
