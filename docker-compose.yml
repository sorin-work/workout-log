name: workout-log

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: workout
      POSTGRES_PASSWORD: workout
      POSTGRES_DB: workout
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgres://workout:workout@db:5432/workout?sslmode=disable
      # Creates demo@example.com / demo-password with half a year of workouts.
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      - db
    ports:
      - '${WEB_PORT:-4413}:8080'

volumes:
  db-data:
